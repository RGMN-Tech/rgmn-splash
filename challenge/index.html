<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to RGMN+ Challenge...</title>
  
  <!-- Meta refresh as fallback -->
  <meta http-equiv="refresh" content="0; url=https://challenge.rgmn.com">
  
  <!-- Canonical URL for SEO -->
  <link rel="canonical" href="https://challenge.rgmn.com">
  
  <!-- Prevent indexing of redirect page -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- JavaScript redirect for instant redirect -->
  <script>
    window.location.replace('https://challenge.rgmn.com');
  </script>
  
  <!-- Basic styling for fallback message -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }
    .redirect-message {
      max-width: 600px;
      margin: 0 auto;
    }
    .spinner {
      border: 2px solid #333;
      border-top: 2px solid #a92231;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #a92231;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-message">
    <h1>Redirecting to RGMN+ Challenge...</h1>
    <div class="spinner"></div>
    <p>If you are not automatically redirected, <a href="https://challenge.rgmn.com">click here</a>.</p>
  </div>
</body>
</html>
